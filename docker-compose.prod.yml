# Producción: Nginx + PHP-FPM. No monta el código fuente.
# Aislado del compose local (`name: ventas_sistema_prod`).
#
# Uso:
#   docker compose -f docker-compose.prod.yml up -d --build
# Requiere APP_KEY, DB_PASSWORD y REDIS_PASSWORD en `.env` (sin fallback).
# No publicar Postgres/Redis al host.

name: ventas_sistema_prod

services:
  nginx:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: nginx
    ports:
      - "${APP_PUBLISH_PORT:-80}:80"
    volumes:
      - storage_data:/var/www/html/storage:ro
    depends_on:
      php:
        condition: service_healthy
    networks:
      - ventas
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: app
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      LOG_LEVEL: error
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ventas_central}
      DB_USERNAME: ${DB_USERNAME:-ventas}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SESSION_SECURE_COOKIE: "true"
      TRUSTED_PROXIES: private
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: ${MAIL_MAILER:-log}
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-false}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ventas
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: app
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ventas_central}
      DB_USERNAME: ${DB_USERNAME:-ventas}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SESSION_SECURE_COOKIE: "true"
      TRUSTED_PROXIES: private
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      HORIZON_ENABLED: ${HORIZON_ENABLED:-false}
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ventas
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/queue-start.sh"]

  scheduler:
    build:
      context: .
      dockerfile: docker/Dockerfile.prod
      target: app
    env_file:
      - .env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ventas_central}
      DB_USERNAME: ${DB_USERNAME:-ventas}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      SESSION_SECURE_COOKIE: "true"
      TRUSTED_PROXIES: private
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ventas
    restart: unless-stopped
    entrypoint: ["php", "artisan", "schedule:work"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ventas_central}
      POSTGRES_USER: ${DB_USERNAME:-ventas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ventas
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: ["sh", "-c", "exec redis-server --save 60 1 --loglevel warning --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ventas
    restart: unless-stopped

networks:
  ventas:
    driver: bridge

volumes:
  postgres_data:
  storage_data:
  redis_data:
