# Desarrollo local únicamente.
# El servicio `app` ejecuta `php artisan serve` (PHP CLI). No incluye nginx ni php-fpm.
# Producción: docker compose -f docker-compose.prod.yml up -d --build
services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    ports:
      - "${APP_PUBLISH_PORT:-8090}:8000"
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:${APP_PUBLISH_PORT:-8090}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ventas_central}
      DB_USERNAME: ${DB_USERNAME:-ventas}
      DB_PASSWORD: ${DB_PASSWORD:-ventas}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      SESSION_DRIVER: file
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-sync}
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      MAIL_USERNAME: ""
      MAIL_PASSWORD: ""
      MAIL_ENCRYPTION: ""
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
      RUN_SEED: ${RUN_SEED:-true}
      WWWUSER: ${WWWUSER:-1000}
      WWWGROUP: ${WWWGROUP:-1000}
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer/cache
      npm_config_cache: /tmp/npm-cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ventas

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    environment:
      APP_ENV: local
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-ventas_central}
      DB_USERNAME: ${DB_USERNAME:-ventas}
      DB_PASSWORD: ${DB_PASSWORD:-ventas}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_DRIVER: redis
      QUEUE_CONNECTION: redis
      RUN_MIGRATIONS: "false"
      RUN_SEED: "false"
      WWWUSER: ${WWWUSER:-1000}
      WWWGROUP: ${WWWGROUP:-1000}
      HORIZON_ENABLED: ${HORIZON_ENABLED:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ventas
    command: ["sh", "/var/www/html/docker/php/queue-start.sh"]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-ventas_central}
      POSTGRES_USER: ${DB_USERNAME:-ventas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-ventas}
    ports:
      - "${DB_PUBLISH_PORT:-5433}:5432"
    volumes:
      # Las credenciales POSTGRES_* solo se aplican la primera vez que se crea este volumen.
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - ventas

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PUBLISH_PORT:-6381}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ventas

  mailhog:
    image: axllent/mailpit
    ports:
      - "${MAILHOG_UI_PORT:-8025}:8025"
      - "${MAILHOG_SMTP_PORT:-1026}:1025"
    networks:
      - ventas

  dozzle:
    image: amir20/dozzle:latest
    profiles: ["obs"]
    ports:
      - "${DOZZLE_PORT:-9999}:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - ventas

  kuma:
    image: louislam/uptime-kuma:1
    profiles: ["obs"]
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - kuma_data:/app/data
    networks:
      - ventas

networks:
  ventas:
    driver: bridge

volumes:
  postgres_data:
  kuma_data:
